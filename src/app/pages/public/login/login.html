<div class="conteudo">
    <div class="conteudo-cards">

        <div class="card-informacao">
            <h1>ReproMT</h1>
            <h2>Mais controle. <span>Menos planilhas</span></h2>
            <p>Gestão reprodutiva simplificada.</p>
        </div>

        <div class="card card-login">
            <h2>Entrar</h2>
            <p>Acesse sua conta para continuar.</p>

            <form (ngSubmit)="login()">
                <div class="mb-3 conteudo-inputs">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail cadastrado"
                        [(ngModel)]="Formlogin.email" name="email">
                </div>

                <div class="mb-3 conteudo-inputs">
                    <label for="senha" class="form-label">Senha</label>
                    <div class="conteudo-olho">
                        <input class="form-control" [type]="mostrarSenha ? 'text': 'password'" id="senha"
                            [(ngModel)]="Formlogin.password" name="password" placeholder="Digite sua senha cadastrada"
                            (focus)="aFocar()" (blur)="saiuFoco()" />

                        @if(mostrarIconeOlho()){
                        <i class="fas olho" (mousedown)="$event.preventDefault()" (click)="ativarCampo()"
                            [class.fa-eye-slash]="mostrarSenha" [class.fa-eye]="!mostrarSenha"></i>
                        }

                    </div>

                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="cont-esqueceu-senha">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar">

                                <label class="form-check-label" for="lembrar">
                                    Lembrar de mim
                                </label>
                            </div>
                            <a href="#" class="esqueceu-senha">Esqueci minha senha </a>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Entrar</button>

            </form>

            <div class="row">
                <div class="col-12">
                    <div class="divisor">
                        <span></span>
                        <p>ou</p>
                        <span></span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="conteudo-nao-possui-conta">
                        <p>Não possui uma conta?</p>

                        <button type="button" class="btn btn-primary">Criar conta</button>
                    </div>
                </div>
            </div>


            @if(msgErro()){
            <p class="msgErr">{{msgErro()}}</p>
            }


        </div>

        @if(isLoading()){
        <div class="loading-overlay">
            <div class="spinner-border text-primary spinner-loading" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>
        }

    </div>
</div>
